<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>La Casa Abandonada</title>
  <defs>
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="0.55" stop-color="#16171a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F5DC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5F5DC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="luna" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfd8e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfd8e6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="marco"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="512" height="512" fill="url(#fondo)"/>

    <!-- luna fría -->
    <circle cx="396" cy="108" r="70" fill="url(#luna)" opacity="0.35"/>
    <circle cx="396" cy="108" r="26" fill="#dfe6f0" opacity="0.85"/>
    <circle cx="406" cy="101" r="22" fill="#16171a" opacity="0.9"/>

    <!-- casa -->
    <g>
      <rect x="318" y="150" width="34" height="70" fill="#3a2a22"/>
      <polygon points="256,120 98,236 98,408 414,408 414,236" fill="#5C4033"/>
      <polygon points="256,120 98,236 124,236 256,142 388,236 414,236" fill="#3a2a22"/>
      <!-- ventanas rotas -->
      <rect x="128" y="262" width="56" height="64" fill="#111111"/>
      <rect x="328" y="262" width="56" height="64" fill="#111111"/>
      <path d="M156 262v64M128 294h56" stroke="#5C4033" stroke-width="5"/>
      <path d="M356 262v64M328 294h56" stroke="#5C4033" stroke-width="5"/>
      <!-- ojo rojo tenue -->
      <rect x="338" y="276" width="14" height="14" fill="#8B0000" opacity="0.85"/>
      <!-- puerta -->
      <path d="M214 408V318a42 42 0 0 1 84 0V408z" fill="#111111"/>
    </g>

    <!-- ojo de cerradura dorado sobre la puerta -->
    <g fill="url(#oro)">
      <circle cx="256" cy="338" r="15"/>
      <path d="M247 344h18l7 46h-32z"/>
    </g>

    <!-- suelo -->
    <rect x="0" y="408" width="512" height="104" fill="#0a0a0a"/>
    <rect x="0" y="408" width="512" height="3" fill="#3a2a22"/>

    <!-- haz de linterna -->
    <polygon points="40,470 410,300 450,420" fill="url(#haz)"/>
    <circle cx="40" cy="470" r="14" fill="#F5F5DC"/>
    <circle cx="40" cy="470" r="30" fill="#F5F5DC" opacity="0.25"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
